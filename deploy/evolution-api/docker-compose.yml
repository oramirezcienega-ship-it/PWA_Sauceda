version: "3.8"

services:
  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - evolution_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configuración del Servidor
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://192.168.100.253:8080
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true

      # Llave de autenticación global de la API (definir la misma en .env del CRM)
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-sauceda_evolution_api_key_2026}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Base de Datos SQLite embebida y optimizada
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=local
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_sauceda

      # Integración con Redis para colas y caché
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_TTL=604800
      - CACHE_REDIS_SAVE_INSTANCES=true

      # Configuración de Instancias WhatsApp
      - DEL_INSTANCE=false
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true

      # Webhooks (Opcional para recibir eventos de vuelta en el CRM)
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_GLOBAL_URL:-https://app.saucedamx.com/api/captacion/whatsapp}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution_net
    depends_on:
      evolution_redis:
        condition: service_healthy

volumes:
  redis_data:
  evolution_instances:
  evolution_store:

networks:
  evolution_net:
    driver: bridge
